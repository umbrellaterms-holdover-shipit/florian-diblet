# Source Data Configuration
raw_html_file: "extracted_messages.html"
sft_dataset: "my_knowledge.jsonl"
dpo_dataset: "dpo_pairs.jsonl"

# Active Run Targets
active_preset: "nano"   # Options: nano, small, medium, large
stage: "sft"            # Options: sft, dpo

# Model Output Directories
output_dir: "./output_checkpoint"
gguf_output: "my_brain.gguf"

# Hardcoded Model Catalog
presets:
  nano:
    hf_id: "Qwen/Qwen2.5-0.5B"
    batch_size: 1
    grad_accum: 4
    learning_rate: 2.0e-5
    max_seq_len: 1024
  small:
    hf_id: "Qwen/Qwen2.5-1.5B"
    batch_size: 1
    grad_accum: 8
    learning_rate: 1.5e-5
    max_seq_len: 2048
  medium:
    hf_id: "Qwen/Qwen2.5-3B"
    batch_size: 1
    grad_accum: 16
    learning_rate: 1.0e-5
    max_seq_len: 2048
  large:
    hf_id: "Qwen/Qwen2.5-7B"
    batch_size: 1
    grad_accum: 16
    learning_rate: 1.0e-5
    max_seq_len: 2048